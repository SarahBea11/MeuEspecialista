<div class="login-page">
  <div class="login-card">
    
    <div class="login-header">
      <div class="login-logo">
        <img src="assets/logo-especialista.png" alt="Meu Especialista" />
      </div>
      <h1>Redefinir Senha</h1>
      <p class="login-subtitulo">Escolha uma nova senha segura para a sua conta.</p>
    </div>

    <div class="login-body">
      <!-- Token inválido -->
      <ng-container *ngIf="tokenInvalido">
        <div class="erro-box">
          <span class="icone-erro">⛔</span>
          <h2>Link inválido ou expirado</h2>
          <p>Este link de recuperação não é mais válido. Solicite um novo.</p>
          <button class="btn-entrar" routerLink="/esqueceu-senha">
            Solicitar novo link
          </button>
        </div>
      </ng-container>

      <!-- Formulário de redefinição -->
      <ng-container *ngIf="!tokenInvalido && !concluido">
        <div class="campo">
          <label class="campo-label">Nova Senha</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              placeholder="Mínimo 6 caracteres"
              [(ngModel)]="novaSenha"
            />
          </div>
        </div>

        <div class="campo">
          <label class="campo-label">Confirmar Nova Senha</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input
              type="password"
              placeholder="Repita a nova senha"
              [(ngModel)]="confirmarSenha"
              (keyup.enter)="redefinir()"
            />
          </div>
        </div>

        <button
          type="button"
          class="btn-entrar"
          (click)="redefinir()"
          [disabled]="carregando"
        >
          <div class="btn-conteudo">
            <span *ngIf="!carregando">Salvar Nova Senha</span>
            <span *ngIf="carregando" class="btn-spinner"></span>
            <span *ngIf="carregando">Salvando...</span>
          </div>
        </button>
      </ng-container>

      <!-- Sucesso -->
      <ng-container *ngIf="concluido">
        <div class="sucesso-box">
          <span class="icone-sucesso">✅</span>
          <h2>Senha redefinida!</h2>
          <p>Você será redirecionado para o login em instantes...</p>
        </div>
      </ng-container>

      <a class="forgot-link" style="text-align: center; margin-top: 15px; margin-bottom: 0;" routerLink="/login">
        ← Voltar para o Login
      </a>
    </div>

  </div>
</div>

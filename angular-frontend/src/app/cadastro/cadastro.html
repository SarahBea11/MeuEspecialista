<nav class="nav-bar">
  <div class="logo">
    <img src="assets/logo-especialista.png" alt="Meu Especialista" />
  </div>

  <div class="menu">
    <a routerLink="/" class="btn-sair">Sair</a>
  </div>
</nav>

<div class="container-cadastro">
  <div class="cadastro-card">
    
    <div class="cadastro-header">
      <h2>Cadastrar-se</h2>
      <p class="cadastro-subtitulo">Preencha os campos abaixo para criar sua conta</p>
    </div>

    <div class="cadastro-body">
      <form (ngSubmit)="criarConta(cadastroForm)" #cadastroForm="ngForm">
        
        <!-- Seleção de Tipo de Usuário -->
        <div class="tipo-usuario-secao">
          <p class="secao-label">Como deseja se cadastrar?</p>
          <div class="opcoes-alinhadas">
            <label class="opcao-card" [class.ativo]="tipoUsuario === 'medico'">
              <input type="radio" name="perfil" value="medico" [(ngModel)]="tipoUsuario" required class="opcao-radio-input" />
              <div class="opcao-card-content">
                <span class="opcao-icon">🩺</span>
                <span class="opcao-titulo">Sou Médico</span>
                <span class="opcao-desc">Para profissionais da saúde</span>
              </div>
            </label>

            <label class="opcao-card" [class.ativo]="tipoUsuario === 'paciente'">
              <input type="radio" name="perfil" value="paciente" [(ngModel)]="tipoUsuario" required class="opcao-radio-input" />
              <div class="opcao-card-content">
                <span class="opcao-icon">👤</span>
                <span class="opcao-titulo">Sou Paciente</span>
                <span class="opcao-desc">Para agendamento e consultas</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Campos de Dados se tipoUsuario estiver selecionado -->
        <div class="cadastro-campos-fade" *ngIf="tipoUsuario">
          
          <h3 class="dados-titulo">Informações Pessoais</h3>
          
          <div class="grid-campos">
            <!-- Nome -->
            <div class="campo full-width">
              <label class="campo-label">Nome Completo</label>
              <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input type="text" name="nome" placeholder="Digite seu nome completo" ngModel required />
              </div>
            </div>

            <!-- Email -->
            <div class="campo full-width">
              <label class="campo-label">E-mail</label>
              <div class="input-wrapper">
                <span class="input-icon">✉️</span>
                <input type="email" name="email" placeholder="Digite seu melhor e-mail" ngModel required />
              </div>
            </div>

            <!-- Senha -->
            <div class="campo">
              <label class="campo-label">Senha</label>
              <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" name="senha" placeholder="Mín. 8 caracteres (letras, números e símbolo)" ngModel required />
              </div>
              <small class="orientacao-senha" style="display: block; font-size: 11px; color: #718096; margin-top: 4px;">A senha deve ter no mínimo 8 caracteres, incluindo letras, números e símbolos.</small>
            </div>

            <!-- Confirmar Senha -->
            <div class="campo">
              <label class="campo-label">Confirmar Senha</label>
              <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" name="confirmaSenha" placeholder="Confirme a senha" ngModel required />
              </div>
            </div>

            <!-- Telefone -->
            <div class="campo">
              <label class="campo-label">Telefone</label>
              <div class="input-wrapper">
                <span class="input-icon">📞</span>
                <input type="text" name="telefone" placeholder="Ex: (11) 99999-9999" ngModel required />
              </div>
            </div>


            <!-- CRM (Apenas Médico) -->
            <div class="campo" *ngIf="tipoUsuario === 'medico'">
              <label class="campo-label">CRM</label>
              <div class="input-wrapper">
                <span class="input-icon">🆔</span>
                <input type="text" name="crm" placeholder="Digite seu CRM" ngModel required />
              </div>
            </div>

            <!-- CPF (Apenas Paciente) -->
            <div class="campo" *ngIf="tipoUsuario === 'paciente'">
              <label class="campo-label">CPF</label>
              <div class="input-wrapper">
                <span class="input-icon">🆔</span>
                <input type="text" name="cpf" placeholder="Digite seu CPF" ngModel required />
              </div>
            </div>
          </div>

          <h3 class="dados-titulo">Localização & Atendimento</h3>

          <div class="grid-campos">
            <!-- Cidade -->
            <div class="campo">
              <label class="campo-label">Cidade</label>
              <div class="input-wrapper">
                <span class="input-icon">📍</span>
                <select name="cidade" ngModel required>
                  <option value="">Selecione sua cidade</option>
                  <option *ngFor="let cidade of cidades" [value]="cidade.nome">
                    {{ cidade.nome }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Endereço -->
            <div class="campo">
              <label class="campo-label">{{ tipoUsuario === 'medico' ? 'Endereço do Consultório' : 'Endereço Residencial' }}</label>
              <div class="input-wrapper">
                <span class="input-icon">🏠</span>
                <input type="text" name="endereco" placeholder="Rua, número, bairro" ngModel required />
              </div>
            </div>

            <!-- Especialidade (Apenas Médico) -->
            <div class="campo full-width" *ngIf="tipoUsuario === 'medico'">
              <label class="campo-label">Especialidade Médica</label>
              <div class="input-wrapper">
                <span class="input-icon">🩺</span>
                <select name="especialidade" ngModel required>
                  <option value="">Selecione sua especialidade</option>
                  <option *ngFor="let esp of especialidades" [value]="esp.nome">
                    {{ esp.nome }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Convênio (Opcional) -->
            <div class="campo full-width">
              <label class="campo-label">Convênio Atendido / Utilizado</label>
              <div class="input-wrapper">
                <span class="input-icon">💳</span>
                <select name="convenio" ngModel>
                  <option value="">Selecione o convênio (Opcional)</option>
                  <option *ngFor="let conv of convenios" [value]="conv.id">
                    {{ conv.nome }}
                  </option>
                </select>
              </div>
            </div>
          </div>

          <!-- Termo de Aceite e LGPD -->
          <div class="campo full-width lgpd-campo" style="margin-top: 15px; margin-bottom: 20px; grid-column: span 2;">
            <label class="lgpd-label" style="display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #4a5568; cursor: pointer; text-align: left;">
              <input type="checkbox" name="aceiteTermos" ngModel required style="margin-top: 3px;" />
              <span>Li e concordo com os <strong>Termos de Uso</strong> e com as políticas de privacidade de dados (<strong>LGPD</strong>).</span>
            </label>
          </div>

          <!-- Ações do Formulário -->
          <div class="botoes-secao">

            <button type="submit" class="btn-criar" [disabled]="!cadastroForm.valid || carregando">
              <div class="btn-conteudo">
                <div *ngIf="carregando" class="btn-spinner"></div>
                <span>{{ carregando ? 'Criando Conta...' : 'Criar Minha Conta' }}</span>
              </div>
            </button>
            
            <div class="botoes-secundarios">
              <button type="button" class="btn-limpar" (click)="limpar(cadastroForm)">
                Limpar
              </button>
              <button type="button" class="btn-cancelar" (click)="cancelar()">
                Cancelar
              </button>
            </div>
          </div>

        </div>

      </form>
    </div>

  </div>
</div>

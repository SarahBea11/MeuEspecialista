<div class="login-container">
  <div class="login-esquerda">
    <div class="logo-box">
      <img src="assets/logo-especialista.png" alt="Meu Especialista" />
    </div>
  </div>

  <!-- LADO DIREITO -->
  <div class="login-direita">
    <div class="form-box">
      <h1>Redefinindo Senha</h1>

      <label>Código de Recuperação (verifique seu e-mail)</label>
      <input type="text" placeholder="" />

      <label>Nova Senha</label>
      <input type="password" />

      <label>Confirmar Nova Senha</label>
      <input type="password" />

      <a class="back" routerLink="/login">Voltar para o Login</a>

      <button type="button" class="btn btn-primary" routerLink="/login">Redefinir Senha</button>
      <button type="button" class="btn btn-secondary" routerLink="/cadastro">Cadastrar-se</button>
    </div>
  </div>

</div>

<div class="login-container">
  <div class="login-esquerda">
    <div class="logo-box">
      <img src="assets/logo-especialista.png" alt="Meu Especialista" />
    </div>
  </div>

  <div class="login-direita">
    <div class="form-box">

      <!-- Estado inicial: formulário de e-mail -->
      <ng-container *ngIf="!enviado">
        <h1>Esqueci minha senha</h1>
        <p class="subtitulo">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>

        <label>E-mail cadastrado</label>
        <input
          type="email"
          placeholder="seu@email.com"
          [(ngModel)]="email"
          (keyup.enter)="enviar()"
        />

        <button
          type="button"
          class="btn btn-primary"
          (click)="enviar()"
          [disabled]="carregando"
        >
          <span *ngIf="!carregando">Enviar link de recuperação</span>
          <span *ngIf="carregando">Enviando... ⏳</span>
        </button>
      </ng-container>

      <!-- Estado após envio -->
      <ng-container *ngIf="enviado">
        <div class="sucesso-box">
          <span class="icone-sucesso">✉️</span>
          <h2>E-mail enviado!</h2>
          <p>Verifique sua caixa de entrada e spam. O link de recuperação expira em <strong>1 hora</strong>.</p>
        </div>
      </ng-container>

      <a class="back" routerLink="/login">← Voltar para o Login</a>
    </div>
  </div>
</div>

<nav class="nav-bar">
    <div class="logo">
        <img src="assets/logo-especialista.png" alt="Meu Especialista" />
    </div>

    <div class="menu">
        <a class="ativo" routerLink="/buscar">Buscar</a>
        <a routerLink="/perfil"> Meu perfil</a>
        <a routerLink="">Sair</a>
    </div>
</nav>

<div class="container-busca">

    <div class="barra-busca">
        <input type="text" placeholder="Digite nome ou CRM do médico">
        <span class="icone">🔍</span>
    </div>

    <div class="conteudo">

        <div class="resultados"></div>

        <div class="filtro">

            <div class="titulo">Filtrar por</div>

            <label>Cidade</label>
            <select [(ngModel)]="cidadeSelecionada">
                <option value="">Todas</option>
                <option *ngFor="let cidade of cidades" [value]="cidade">
                    {{ cidade }}
                </option>
            </select>

            <label>Convênio</label>
            <select [(ngModel)]="convenioSelecionado">
                <option value="">Todos</option>
                <option *ngFor="let c of convenios" [value]="c">
                    {{ c }}
                </option>
            </select>

            <label>Especialidade</label>
            <select [(ngModel)]="especialidadeSelecionada">
                <option value="">Todas</option>
                <option *ngFor="let esp of especialidades" [value]="esp">
                    {{ esp }}
                </option>
            </select>


        </div>

    </div>

</div>

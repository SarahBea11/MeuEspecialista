<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">
        <img src="assets/logo-especialista.png" alt="Meu Especialista" />
      </div>
      <h1>Meu Especialista</h1>
      <p class="login-subtitulo">Acesse sua conta para continuar</p>
    </div>

    <div class="login-body">

      <!-- Alerta de erro -->
      <div class="error-alert" *ngIf="errorMessage">
        <span class="error-icon">⚠️</span>
        {{ errorMessage }}
      </div>

      <!-- Campo E-mail -->
      <div class="campo">
        <label class="campo-label">E-mail</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            name="email"
            [(ngModel)]="loginData.email"
            placeholder="seu@email.com"
          />
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="campo">
        <label class="campo-label">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            name="password"
            [(ngModel)]="loginData.senha"
            placeholder="Digite sua senha"
          />
        </div>
      </div>

      <!-- Esqueceu a senha -->
      <a routerLink="/esqueceu-senha" class="forgot-link">
        Esqueceu a senha?
      </a>

      <!-- Botão Entrar -->
      <button class="btn-entrar" (click)="logar()" [disabled]="loading">
        <div class="btn-conteudo">
          <div *ngIf="loading" class="btn-spinner"></div>
          <span>{{ loading ? 'Entrando...' : 'Entrar' }}</span>
        </div>
      </button>

      <!-- Divisor -->
      <div class="divisor">
        <span>Não tem uma conta?</span>
      </div>

      <!-- Botão Cadastro -->
      <button class="btn-cadastro" routerLink="/">
        Criar Minha Conta
      </button>

    </div>
  </div>
</div>
